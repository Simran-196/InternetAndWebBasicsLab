<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your Name" minlength="3" maxlength="30" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your Email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" minlength="8" required>
        <br><br>

        <label for="mobile">Number:</label>
        <input type="tel" id="mobile" name="mobile" placeholder="Enter your Mobile Number" minlength="10" maxlength="10" required>
        <br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" placeholder="Enter your Age" min="17" max="30" required>
        <br><br>

        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" required>
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other" required>
        <label for="other">Other</label>
        <br><br>

        <label for="course">Select a Course</label>
        <select id="course" name="course" required>
            <option value="">Select</option>
            <option value="btech">B.Tech</option> <li>10th - Army Public School , Jodhpur</li>
            <option value="bca">BCA</option>
            <option value="mca">MCA</option>
            <option value="bba">BBA</option>
        </select>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" placeholder="Enter your Date of Birth" min="1996-10-26" max="2009-10-26" required>
        <br><br>

        <label for="website">Enter URL of your website(if any):</label>
        <input type="text" id="website" name="website" placeholder="Enter your Website" >
        <br><br>

        <input type="checkbox" id="terms" name="terms" value="accepted" required>
        <label for="terms">I agree to given terms and conditions.</label>
        <br><br>

        <button type="submit" required>Submit</button> 
        <button type="reset" required>Reset</button> 

    </form>
    
</body>
</html>
